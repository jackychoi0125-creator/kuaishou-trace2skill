benchmark: alfworld
kit:
  root: ../../benchmarks/alfworld-v2-kit
  harbor_version: 0.23.0
  pi_version: 0.85.1
  train_split: benchmark/splits/train/items.json
  val_split: benchmark/splits/val/items.json
  test_split: benchmark/splits/test/items.json
  concurrency: 1
  target_thinking: disabled
  max_environment_actions: 50
models:
  target:
    name: deepseek-v4-flash
    thinking: disabled
  optimizer:
    name: kimi-k2.6
    thinking: enabled
    max_completion_tokens: 90000
search:
  initial_best: no_skill
  initial_skill_for_reflection: src/skillopt/envs/alfworld/skills/blank.md
  max_candidates: 2
  train_regression_tolerance: 0.05
  minibatch_size: 8
  max_edits_per_candidate: 1
  generation_token_budget: 900000
  slow_update: false
  meta_skill: false
evaluation:
  gate: official_harbor_won
  val_only: true
  run_test: false
