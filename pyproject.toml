[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace2skill-submission"
version = "0.1.0"
description = "Harbor + SkillOpt self-evolving Agent Skill competition submission"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "openai>=1.30.0",
  "pyyaml>=6.0",
  "numpy>=1.24.0",
  "openpyxl>=3.1.0",
  "azure-identity>=1.15.0",
  "azure-core>=1.30.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4.0", "pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["skillopt", "skillopt.*", "trace2skill", "trace2skill.*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.yaml"]
